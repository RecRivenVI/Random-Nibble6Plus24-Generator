modLoader = "javafml"
loaderVersion = "[${javafml_minimum},)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}_probe"
version = "${mod_version}"
displayName = "${mod_name} development probes"
authors = "${mod_authors}"
description = "Explicit native seed and persisted generation contract verification"
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}_probe]]
modId = "${mod_id}"
mandatory = true
versionRange = "[${mod_version}]"
ordering = "AFTER"
side = "BOTH"
