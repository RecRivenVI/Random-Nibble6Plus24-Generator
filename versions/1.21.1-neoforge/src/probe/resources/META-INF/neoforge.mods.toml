modLoader = "javafml"
loaderVersion = "[${javafml_minimum},)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}_probe"
version = "${mod_version}"
displayName = "${mod_name} development probes"
authors = "${mod_authors}"
description = "Explicit independent native structure-input Oracle only"

[[dependencies.${mod_id}_probe]]
modId = "${mod_id}"
type = "required"
versionRange = "[${mod_version}]"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "mosaic-structure-input-test.mixins.json"

[[mixins]]
config = "mosaic-dependency-smoke.mixins.json"
